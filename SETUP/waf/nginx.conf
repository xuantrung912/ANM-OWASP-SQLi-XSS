map "${CSP_ENABLED}" $csp_value {
    "1"     "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'";
    default "";
}

server {
    listen 80;
    server_name _;

    include /etc/nginx/security_headers.conf;
    add_header Content-Security-Policy $csp_value always;

    location / {
        proxy_pass http://waf:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Can giu nguyen Cookie va Set-Cookie de khong pha session_id cua express-session
        proxy_pass_header Set-Cookie;
        proxy_hide_header X-Powered-By;
    }
}
