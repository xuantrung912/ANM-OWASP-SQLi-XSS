# TV3 - tieu de bao mat tang proxy.
# QUAN TRONG ve CSP: app (TV2) da tu set CSP rieng o che do secure, co 'unsafe-inline'
# (xem session_security.js -> securityHeaders()). Theo chuan HTTP, khi trinh duyet nhan
# NHIEU header Content-Security-Policy tu cac tang khac nhau, no phai thoa MAN CA HAI
# chinh sach cung luc (giao cua tap hop). Vi vay CSP khong unsafe-inline dat o day
# van chan duoc script nhung, du tang app co cho phep. Day la diem hay de phan tich
# trong muc 4.2 cua bao cao: phong thu nhieu lop, khong can sua code TV2.
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "geolocation=(), camera=(), microphone=()" always;
