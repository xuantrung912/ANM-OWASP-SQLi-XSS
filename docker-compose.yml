services:
  web-app:
    build: ./SOURCE/web-app/backend
    ports:
      - "3000:3000"
    environment:
      - MODE=secure
      - DB_HOST=db
      - DB_USER=app_user
      - DB_PASSWORD=AppPass123!
      - DB_NAME=shop_db
    depends_on:
      - db
  db:
    image: mysql:8
    environment:
      - MYSQL_ROOT_PASSWORD=rootpass
      - MYSQL_DATABASE=shop_db
    ports:
      - "3307:3306"
    volumes:
      - ./SOURCE/database/init.sql:/docker-entrypoint-initdb.d/init.sql