; ==============================================================================
; SOURCE/web-app/secure/config/session/php_session.ini
; Thiết lập chuẩn an ninh cao nhất cho PHP Session Management
; ==============================================================================

; Bắt buộc sử dụng Cookie để lưu trữ Session ID
session.use_cookies = 1
session.use_only_cookies = 1

; Vô hiệu hóa việc hiển thị SID trên thanh địa chỉ URL
session.use_trans_sid = 0

; [PHÒNG THỦ XSS]: Bật cờ HttpOnly cho Cookie phiên
session.cookie_httponly = 1

; [PHÒNG THỦ CSRF]: Bật SameSite hạn chế gửi cookie từ trang thứ ba
session.cookie_samesite = "Lax"

; Chỉ gửi Cookie qua giao thức bảo mật HTTPS (Bật khi triển khai Production)
session.cookie_secure = 0

; Thuật toán băm phiên mạnh mẽ
session.hash_function = sha256
session.entropy_length = 32
