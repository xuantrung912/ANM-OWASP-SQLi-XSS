    Thành viên 2: Tra cứu đơn hàng an toàn (Chống DOM-based XSS)
-->
<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Tra Cứu Vận Đơn An Toàn (Secure DOM)</title>
    <style>
        body { font-family: sans-serif; padding: 25px; background: #f8fafc; }
        .card { background: white; padding: 25px; border-radius: 8px; max-width: 600px; margin: auto; border: 1px solid #86efac; }
    </style>
</head>
<body>
    <div class="card">
        <h2 style="color:#166534;">🛡️ Tra Cứu Vận Đơn (Đã Phòng Thủ DOM XSS)</h2>
        <p>Tham số từ URL Hash được hiển thị an toàn tuyệt đối.</p>
        
        <div id="status-panel" style="background: #f0fdf4; border: 1px solid #86efac; padding: 15px; border-radius: 6px; margin-top: 15px;">
            <div id="hash-target">Đang tải trạng thái...</div>
        </div>
    </div>

    <script>
    (function() {
        var rawHash = window.location.hash.substring(1);
        var target = document.getElementById("hash-target");

        if (rawHash) {
            var decoded = decodeURIComponent(rawHash);
            // [PHÒNG THỦ DOM XSS]: Dùng textContent thay thế toàn bộ innerHTML
            target.textContent = "Thông tin vận chuyển cho đơn: " + decoded;
        } else {
            target.textContent = "Không tìm thấy mã bưu gửi trong hash.";
        }
    })();
    </script>
</body>
</html>
